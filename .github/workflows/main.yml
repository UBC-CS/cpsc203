name: deploy-website

# Only run this when the main branch changes
on:
  workflow_dispatch:
  push:
    branches:
    - main
  schedule:
    - cron: '25 11 * * 1'
    - cron: '25 11 * * 6'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    # GitHub caches Python versions with the runner thus likely faster than uv
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: pyproject.toml

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: renv

    - name: Install R dependencies
      run: Rscript -e "options(renv.config.pak.enabled = FALSE); renv::restore(prompt = FALSE)"

    - name: Install Python dependencies and render Quarto
      run: uv run quarto render

    # Uses keep_files so that permanent archived term snapshots (e.g. /2025w2/)
    # on the gh-pages branch survive future deploys of the current site.
    - name: Publish Quarto project
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
        keep_files: true
