<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Data and information</title>
<desc>Two bubbles, information and data, joined by two arrows: information is represented as data, and data is interpreted as information.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="280" fill="#ffffff"/>

<ellipse cx="190" cy="150" rx="92" ry="56" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="500" fill="#26215C">Information</text>

<ellipse cx="490" cy="150" rx="92" ry="56" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="490" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="500" fill="#04342C">Data</text>

<path d="M268 111 Q340 68 412 111" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3C3489">represented as</text>

<path d="M412 189 Q340 232 268 189" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="340" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#085041">interpreted as</text>

</svg>
