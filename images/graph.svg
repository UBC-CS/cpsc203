<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 413 207" width="826" height="414" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e5eff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="413" height="207" fill="#ffffff"/>

  <!-- Edges -->
  <g stroke="#000000" stroke-width="2" stroke-linecap="round">
    <line x1="57" y1="110" x2="127" y2="110"/>  <!-- E-C -->
    <line x1="127" y1="110" x2="205" y2="73"/>  <!-- C-A -->
    <line x1="127" y1="110" x2="205" y2="150"/> <!-- C-D -->
    <line x1="205" y1="73" x2="285" y2="110"/>  <!-- A-B -->
    <line x1="205" y1="150" x2="285" y2="110"/> <!-- D-B -->
    <line x1="285" y1="110" x2="345" y2="110"/> <!-- B-F -->
  </g>

  <!-- Annotation text -->
  <g fill="#1e5eff" font-size="12">
    <text x="58" y="58">Nodes / Vertices</text>
    <text x="270" y="193">Edges</text>
  </g>

  <!-- Annotation arrows -->
  <g stroke="#1e5eff" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="150" y1="55" x2="190" y2="66"/>   <!-- to node A -->
    <line x1="100" y1="65" x2="119" y2="94"/>   <!-- to node C -->
    <line x1="265" y1="182" x2="237" y2="154"/> <!-- to edge D-B -->
    <line x1="290" y1="182" x2="322" y2="116"/> <!-- to edge B-F -->
  </g>

  <!-- Nodes -->
  <g fill="#43a047" stroke="#2e7d32" stroke-width="1.5">
    <circle cx="57"  cy="110" r="14"/>
    <circle cx="127" cy="110" r="14"/>
    <circle cx="205" cy="73"  r="14"/>
    <circle cx="205" cy="150" r="14"/>
    <circle cx="285" cy="110" r="14"/>
    <circle cx="345" cy="110" r="14"/>
  </g>

  <!-- Node labels -->
  <g fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="57"  y="110">E</text>
    <text x="127" y="110">C</text>
    <text x="205" y="73">A</text>
    <text x="205" y="150">D</text>
    <text x="285" y="110">B</text>
    <text x="345" y="110">F</text>
  </g>
</svg>
